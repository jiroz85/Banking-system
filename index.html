<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banking Management System | Java Swing & MySQL</title>
  <meta http-equiv="refresh" content="3; url=https://github.com/jiroz85/Banking-system">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b0f14;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background-color: #131c29;
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 12px;
      padding: 40px 30px;
      max-width: 520px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background-color: rgba(79, 124, 255, 0.15);
      color: #4f7cff;
      border: 1px solid rgba(79, 124, 255, 0.3);
      margin: 4px;
    }
    .btn {
      display: inline-block;
      background-color: #4f7cff;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #3b6bd6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🏦 Banking Management System</h1>
    <p>A desktop banking application built with Java Swing and MySQL database.</p>
    <div>
      <span class="badge">Java</span>
      <span class="badge">MySQL</span>
      <span class="badge">JDBC</span>
      <span class="badge">Java Swing</span>
    </div>
    <p style="margin-top: 24px; font-size: 13px;">Redirecting you to the GitHub repository...</p>
    <a href="https://github.com/jiroz85/Banking-system" class="btn">View on GitHub</a>
  </div>
</body>
</html>
